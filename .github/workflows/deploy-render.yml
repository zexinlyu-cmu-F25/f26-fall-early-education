# Deploys the KidDash static site on Render whenever main gets a new commit.
# Needs the repo secret RENDER_DEPLOY_HOOK_URL (Render → kiddash → Settings → Deploy Hook).
# The hook URL is a deploy credential: keep it in the secret, never in code.
# A successful run only means Render accepted the request; check Render for the build result.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow a manual run from the Actions tab

concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$RENDER_DEPLOY_HOOK_URL"
